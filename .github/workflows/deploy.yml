name: Deploy WeChat Service

on:
  # 当推送到 main/master 分支时触发
  push:
    branches: [ main, master ]
  
  # 允许手动触发
  workflow_dispatch:

# 环境变量
env:
  NODE_VERSION: '18'
  DEPLOY_PATH: '/var/www/wechat-service'
  
jobs:
  # 测试任务
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linting
        run: npm run lint
      
      - name: Run tests
        run: npm test

  # 部署任务
  deploy:
    name: Deploy to Server
    needs: test
    runs-on: ubuntu-latest
    # 只有推送到 main 分支时才执行部署
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies
        # 全量安装（含 nodemon 等 devDependencies），部署包内的 npx nodemon 才能运行
        run: npm ci
      
      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r node_modules app.js router ecosystem.config.cjs package.json package-lock.json deploy/
          cd deploy && tar czf ../deploy.tar.gz .
      
      - name: Deploy to server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy.tar.gz"
          target: "${{ env.DEPLOY_PATH }}"
          strip_components: 0
      
      - name: Restart service on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            
            # 解压部署包
            tar xzf deploy.tar.gz
            rm deploy.tar.gz
            
            # 创建或更新 .env 文件（app.js 通过 dotenv 自动加载）
            cat > .env << 'EOF'
            PORT=${{ secrets.PORT || 3000 }}
            WECHAT_TOKEN=${{ secrets.WECHAT_TOKEN }}
            NODE_ENV=production
            EOF
            
            # 日志目录
            mkdir -p logs
            
            # 停止旧进程（用变量拼进程名，避免 pkill 误杀执行脚本自身）
            APP="app.js"
            pkill -f "nodemon ${APP}" 2>/dev/null || true
            pkill -f "node ${APP}" 2>/dev/null || true
            sleep 1
            
            # 后台启动 nodemon（ssh 断开后仍运行，日志写入 logs/out.log）
            nohup npx --no-install nodemon ${APP} </dev/null >> logs/out.log 2>&1 &

  # 通知任务（可选）
  notify:
    name: Send Notification
    needs: [test, deploy]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Notify on success
        if: ${{ success() }}
        run: echo "✅ Deployment successful!"
        
      - name: Notify on failure
        if: ${{ failure() }}
        run: echo "❌ Deployment failed!"