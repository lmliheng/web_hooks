name: Deploy WeChat Service

on:
  # 当推送到 main/master 分支时触发
  push:
    branches: [ main, master ]
  
  # 允许手动触发
  workflow_dispatch:

# 环境变量
env:
  NODE_VERSION: '18'
  DEPLOY_PATH: '/var/www/wechat-service',
  

jobs:
  # 测试任务
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linting
        run: npm run lint || true
      
      - name: Run tests
        run: npm test || echo "No tests configured"

  # 部署任务
  deploy:
    name: Deploy to Server
    needs: test
    runs-on: ubuntu-latest
    # 只有推送到 main 分支时才执行部署
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies
        run: npm ci --production
      
      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r node_modules dist src package.json package-lock.json deploy/
          cd deploy && tar czf ../deploy.tar.gz .
      
      - name: Deploy to server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy.tar.gz"
          target: "${{ env.DEPLOY_PATH }}"
          strip_components: 0
      
      - name: Restart service on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            
            # 解压部署包
            tar xzf deploy.tar.gz
            rm deploy.tar.gz
            
            # 创建或更新 .env 文件
            cat > .env << EOF
            PORT=${{ secrets.PORT || 3000 }}
            WECHAT_TOKEN=${{ secrets.WECHAT_TOKEN }}
            NODE_ENV=production
            EOF
            
            # 停止旧服务
            pm2 stop wechat-service 2>/dev/null || true
            
            # 启动新服务
            pm2 start app.js --name wechat-service --update-env
            
            # 保存 PM2 进程列表以便开机自启
            pm2 save

  # 通知任务（可选）
  notify:
    name: Send Notification
    needs: [test, deploy]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Notify on success
        if: ${{ success() }}
        run: echo "✅ Deployment successful!"
        
      - name: Notify on failure
        if: ${{ failure() }}
        run: echo "❌ Deployment failed!"